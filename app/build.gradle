plugins { id 'com.android.application' }
android {
    namespace 'dev.yz.dnsobserver'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.yz.dnsobserver'
        minSdk 29
        targetSdk 35
        versionCode 19
        versionName '0.6.0-beta2'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    // CompileOnly: libxposed API classes supplied by LSPosed 2.2.1 at runtime.
    compileOnly 'io.github.libxposed:api:102.0.0'
}
