name: Android Debug APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'tests/**'
      - 'runtime/**'
      - 'module/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-android.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub-hosted Ubuntu includes Android SDK command-line tools.
      # setup-android@v3 attempts to install the removed SDK "tools" package.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Test and build independent Root runtime
        run: |
          cd runtime
          go mod tidy
          gofmt -w .
          go test -race ./...
          go vet ./...
          mkdir -p ../module/bin
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o ../module/bin/yutong ./cmd/yutong
          cd ..
          for script in module/*.sh; do sh -n "$script"; done
          python3 tests/test_runtime_wiring.py
          cd module
          zip -r ../YuTong-Runtime-v0.7.0-beta1-KernelSU-arm64.zip .
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME must be set on runner}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check DNS protocol helpers and Root shell syntax
        shell: bash
        run: |
          set -euo pipefail
          sh -n app/src/main/assets/dns-root.sh
          sh -n app/src/main/assets/dns-ipv6-tproxy-probe.sh
          sh -n app/src/main/assets/dns-ipv6-global.sh
          sh -n app/src/main/assets/system-ipv6.sh
          sh -n app/src/main/assets/dns-ui-status.sh
          sh -n app/src/main/assets/dns-box-status.sh
          python3 tests/test_box_probe.py
          python3 tests/test_ipv6_stop_verify.py
          python3 tests/test_ipv4_cleanup.py
          python3 tests/test_ipv6_route_failure.py
          python3 tests/test_ui_status_probe.py
          python3 tests/test_system_ipv6.py
          python3 tests/test_takeover_v062.py
          python3 tests/test_ipv6_global.py
          python3 tests/test_ipv6_failure_latch.py
          python3 tests/test_ipv6_experiment.py
          python3 tests/test_ipv6_simulator.py
          python3 tests/test_ipv6_root_probe.py
          python3 tests/test_upstream_isolated.py
          python3 tests/test_ipv6_listener_lifecycle.py
          python3 tests/test_ipv6_pilot.py
          python3 tests/test_ipv6_pilot_ui.py
          python3 tests/test_log_copy.py
          mkdir -p /tmp/dnsobserver-jvm
          javac -encoding UTF-8 -d /tmp/dnsobserver-jvm \
            app/src/main/java/dev/yz/dnsobserver/DnsPacket.java \
            app/src/main/java/dev/yz/dnsobserver/DnsUpstreamExchange.java \
            app/src/main/java/dev/yz/dnsobserver/DnsBootstrap.java \
            app/src/main/java/dev/yz/dnsobserver/DnsProbe.java \
            app/src/main/java/dev/yz/dnsobserver/DnsFailover.java \
            app/src/main/java/dev/yz/dnsobserver/DnsFeatureState.java \
            tests/DnsFeatureStateTest.java \
            app/src/main/java/dev/yz/dnsobserver/DnsStateEpoch.java \
            tests/DnsStateEpochTest.java \
            app/src/main/java/dev/yz/dnsobserver/DnsJobRuns.java \
            tests/DnsJobRunsTest.java \
            app/src/main/java/dev/yz/dnsobserver/BoxWatchState.java \
            tests/BoxWatchStateTest.java \
            app/src/main/java/dev/yz/dnsobserver/DnsTcpAcceptLoop.java \
            tests/DnsTcpAcceptLoopTest.java \
            app/src/main/java/dev/yz/dnsobserver/RootScriptFiles.java \
            tests/stubs/android/content/Context.java \
            tests/RootScriptFilesTest.java \
            tests/DnsPacketTest.java \
            app/src/main/java/dev/yz/dnsobserver/DnsObservation.java \
            tests/DnsObservationTest.java \
            tests/DnsBootstrapFallbackTest.java \
            tests/DnsUpstreamExchangeTest.java \
            tests/DnsProbeTest.java \
            app/src/main/java/dev/yz/dnsobserver/DnsIcmpProbe.java \
            app/src/main/java/dev/yz/dnsobserver/DnsDiagnosis.java \
            tests/DnsIcmpProbeTest.java \
            tests/DnsFailoverTest.java
          java -cp /tmp/dnsobserver-jvm dev.yz.dnsobserver.DnsJobRunsTest
          java -cp /tmp/dnsobserver-jvm dev.yz.dnsobserver.DnsStateEpochTest
          java -cp /tmp/dnsobserver-jvm dev.yz.dnsobserver.BoxWatchStateTest
          java -cp /tmp/dnsobserver-jvm dev.yz.dnsobserver.DnsTcpAcceptLoopTest
          java -cp /tmp/dnsobserver-jvm dev.yz.dnsobserver.RootScriptFilesTest
          java -cp /tmp/dnsobserver-jvm dev.yz.dnsobserver.DnsFeatureStateTest
          java -cp /tmp/dnsobserver-jvm dev.yz.dnsobserver.DnsObservationTest
          java -cp /tmp/dnsobserver-jvm dev.yz.dnsobserver.DnsBootstrapFallbackTest
          java -cp /tmp/dnsobserver-jvm dev.yz.dnsobserver.DnsPacketTest
          java -cp /tmp/dnsobserver-jvm dev.yz.dnsobserver.DnsUpstreamExchangeTest
          java -cp /tmp/dnsobserver-jvm dev.yz.dnsobserver.DnsProbeTest
          java -cp /tmp/dnsobserver-jvm dev.yz.dnsobserver.DnsIcmpProbeTest
          java -cp /tmp/dnsobserver-jvm dev.yz.dnsobserver.DnsFailoverTest
          python3 tests/test_sqlite_migration.py
          python3 tests/test_manifest.py
          python3 tests/test_branding.py
          python3 tests/test_triple_dns.py
          python3 tests/test_icmp_wiring.py
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify modern LSPosed module packaging
        run: |
          python3 - <<'PY'
          import zipfile
          p = 'app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(p) as z:
              members = set(z.namelist())
              base = 'META-INF/xposed/'
              expected = {base + 'java_init.list', base + 'scope.list', base + 'module.prop'}
              assert expected.issubset(members), 'Modern module metadata missing: ' + repr(expected - members)
              assert 'assets/xposed_init' not in members, 'Legacy entry file must be absent'
              assert 'assets/dns-box-status.sh' in members, 'Box state probe missing from APK'
              assert 'assets/dns-ui-status.sh' in members, 'Feature status probe missing from APK'
              assert 'assets/system-ipv6.sh' in members, 'System IPv6 toggle missing from APK'
              assert 'assets/dns-root.sh' in members, 'Root DNS control script missing from APK'
              assert 'assets/dns-ipv6-tproxy-probe.sh' in members, 'IPv6 TPROXY experiment missing from APK'
              assert 'assets/dns-ipv6-global.sh' in members, 'IPv6 global scoped control script missing from APK'
              assert z.read(base + 'java_init.list').decode().strip() == 'dev.yz.dnsobserver.ModernHookEntry'
              assert z.read(base + 'scope.list').decode().strip() == 'system'
              props = z.read(base + 'module.prop').decode()
              assert 'targetApiVersion=102' in props and 'minApiVersion=102' in props
          print('Verified: Modern API 102 resources included; no legacy entry')
          PY
      - name: Package complete source snapshot
        run: git archive --format=zip --output=DNSObserver-v0.7.0-beta1-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: DNSObserver-v0.7.0-beta1-source
          path: DNSObserver-v0.7.0-beta1-source.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: DNSObserver-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: YuTong-Runtime-KernelSU
          path: YuTong-Runtime-v0.7.0-beta1-KernelSU-arm64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Root-runtime-source-formatted
          path: |
            runtime/**/*.go
            runtime/go.mod
            runtime/go.sum
